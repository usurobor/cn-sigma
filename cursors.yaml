schema: cnos.home-cursors.v1
# Per-box read cursors for every box home reads. Home is the sole compactor;
# it pulls these boxes and compacts them upward into the r1+ tower.
#
# Each cursor: {repo, ref, last_read_sha}. Real SHAs are the live
# activation-log-v0 foreign-log cursors carried from the old registry. The
# #690/#698 box-topology feed cursors are pending (runtime not built yet) and
# left null — NO SHAs fabricated.

cursors:

  # --- own activation loci (activation-log-v0 foreign logs; live cursors) ---
  - box: cnos/log-v0
    repo: usurobor/cnos
    ref: refs/heads/main            # foreign log path .cn-sigma/logs/
    last_read_sha: cbe42051aee116033e75b716b8319f1a0128679f
  - box: bumpt/log-v0
    repo: usurobor/bumpt
    ref: refs/heads/main
    last_read_sha: 09035aedd3e9764bc35d63b51682a2949c519efe
  - box: tsc/log-v0
    repo: usurobor/tsc
    ref: refs/heads/main
    last_read_sha: e2172fdcf1a44c7e103eb9e41cf2512b82d4865c

  # --- own activation loci (box-topology feeds; runtime pending) ---
  - box: cnos/dialogue
    repo: usurobor/cnos
    ref: cn-sigma/cnos/dialogue
    last_read_sha: null
  - box: cnos/memory
    repo: usurobor/cnos
    ref: cn-sigma/cnos/memory
    last_read_sha: null
  - box: cnos/state
    repo: usurobor/cnos
    ref: cn-sigma/cnos/state
    last_read_sha: null
  - box: bumpt/feeds
    repo: usurobor/bumpt
    ref: cn-sigma/bumpt/{dialogue,memory,state}
    last_read_sha: null
  - box: tsc/feeds
    repo: usurobor/tsc
    ref: cn-sigma/tsc/{dialogue,memory,state}
    last_read_sha: null
  - box: cmp/feeds
    repo: null                       # pending: δ to confirm cmp repo
    ref: cn-sigma/cmp/{dialogue,memory,state}
    last_read_sha: null

  # --- peers (pull-only; runtime pending) ---
  - box: cn-pi/feeds
    repo: usurobor/cn-pi
    ref: cn-pi/home/{dialogue,memory,state}
    last_read_sha: null
  - box: cn-omega/feeds
    repo: usurobor/cn-omega
    ref: cn-omega/home/{dialogue,memory,state}
    last_read_sha: null
