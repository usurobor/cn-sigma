    convention: agent-activation-log-v0
    log_v0:
      foreign_log: ".cn-sigma/logs/"
      home_log: "_r0-box/activations/tsc/"
      last_read_foreign_log: e2172fdcf1a44c7e103eb9e41cf2512b82d4865c
    feeds:
      dialogue: { ref: cn-sigma/tsc/dialogue, last_read_sha: null }
      memory:   { ref: cn-sigma/tsc/memory,   last_read_sha: null }
